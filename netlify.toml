# Netlify: web estática, sin paso de build. Se publica la raíz del repo.
[build]
  publish = "."
  command = ""

# Los archivos de pruebas y del servidor de Google no hacen falta en la web pública.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
